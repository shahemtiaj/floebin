<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FE3FF"/>
      <stop offset="0.6" stop-color="#3AA0F5"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B6FE0"/>
      <stop offset="1" stop-color="#0A2A6E"/>
    </linearGradient>
    <linearGradient id="iceLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDF4FF"/>
    </linearGradient>
    <linearGradient id="iceShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BFE8FF"/>
      <stop offset="1" stop-color="#8CCDF2"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C8CF4"/>
      <stop offset="1" stop-color="#1257C9"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="floeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0A2A6E" flood-opacity="0.35"/>
    </filter>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- Squircle body with drop shadow -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="#1B6FE0" filter="url(#shadow)"/>

  <g clip-path="url(#body)">
    <!-- Sky / air -->
    <rect x="100" y="100" width="824" height="500" fill="url(#sky)"/>
    <!-- Water -->
    <rect x="100" y="596" width="824" height="330" fill="url(#water)"/>

    <!-- Submerged part of the floe -->
    <polygon points="250,596 778,596 726,760 566,842 382,812 300,708" fill="#FFFFFF" fill-opacity="0.16"/>

    <!-- Floe above water -->
    <g filter="url(#floeShadow)">
      <polygon points="250,596 312,428 420,346 552,312 660,368 750,468 778,596" fill="url(#iceLight)"/>
      <!-- Shaded right facet -->
      <polygon points="552,312 660,368 750,468 778,596 590,596 600,420" fill="url(#iceShade)"/>
      <!-- Small left facet -->
      <polygon points="250,596 312,428 360,470 330,596" fill="#EAF8FF"/>
    </g>

    <!-- Download arrow cut into the floe -->
    <path d="M482 384 h64 a8 8 0 0 1 8 8 v110 h56 a8 8 0 0 1 6 13 l-94 96 a10 10 0 0 1 -14 0 l-94 -96 a8 8 0 0 1 6 -13 h56 v-110 a8 8 0 0 1 8 -8 z" fill="url(#arrow)"/>

    <!-- Waterline highlight -->
    <rect x="100" y="592" width="824" height="8" fill="#BFE8FF" fill-opacity="0.55"/>

    <!-- Ripples -->
    <g stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="12" stroke-linecap="round">
      <line x1="150" y1="640" x2="228" y2="640"/>
      <line x1="800" y1="640" x2="878" y2="640"/>
      <line x1="196" y1="682" x2="250" y2="682"/>
      <line x1="776" y1="682" x2="830" y2="682"/>
    </g>

    <!-- Soft top gloss -->
    <rect x="100" y="100" width="824" height="260" fill="url(#gloss)"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
